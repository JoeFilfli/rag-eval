services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rag
      DOCUMENT_STORE_PATH: /app/documents
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/documents:/app/documents

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8002
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
